<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>RetroMiniDisc — Disc Archive</title>

  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <main class="shell">

    <header class="masthead">

      <div class="brand">
        RETROMINIDISC
      </div>

      <div class="tagline">
        DISC ARCHIVE
      </div>

    </header>


    <!-- TOP NAVIGATION -->

    <nav class="back">

      <a href="../index.html">
        ← BACK TO ARCHIVE
      </a>

    </nav>


    <!-- DISC HEADER -->

    <section class="hero">

      <div class="eyebrow" id="disc-eyebrow">
        LOADING...
      </div>

      <h1 id="disc-title">
        MiniDisc
      </h1>

    </section>


    <!-- PHYSICAL DISC SPECIFICATIONS -->

    <section class="spec-grid">

      <div class="spec">
        <span>DISC</span>
        <strong id="disc-id">—</strong>
      </div>

      <div class="spec">
        <span>MEDIA</span>
        <strong id="disc-media">—</strong>
      </div>

      <div class="spec">
        <span>MODE</span>
        <strong id="disc-mode">—</strong>
      </div>

      <div class="spec">
        <span>BITRATE</span>
        <strong id="disc-bitrate">—</strong>
      </div>

      <div class="spec">
        <span>GROUPS</span>
        <strong id="disc-groups">—</strong>
      </div>

    </section>


    <!-- GROUPS -->

    <section id="groups">

      <p class="loading">
        LOADING GROUPS...
      </p>

    </section>


    <!-- BOTTOM NAVIGATION -->

    <nav class="back">

      <a href="../index.html">
        ← BACK TO ARCHIVE
      </a>

    </nav>


    <footer id="disc-footer">
      RETROMINIDISC
    </footer>

  </main>


  <script src="../js/disc.js"></script>

</body>
</html>
